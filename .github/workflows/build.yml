name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Fix Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/oceantheme2
          mkdir -p app/src/main
          mv MainActivity.kt app/src/main/java/com/example/oceantheme2/ || true
          mv AndroidManifest.xml app/src/main/ || true
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.oceantheme2"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.oceantheme2"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OceanTheme2"
          include(":app")
          EOF
          cat > app/src/main/java/com/example/oceantheme2/MainActivity.kt <<'EOF'
          package com.example.oceantheme2
          import android.app.Activity
          import android.os.Bundle
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Button
          import android.graphics.Color
          import android.view.Gravity
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setBackgroundColor(Color.parseColor("#062A4D"))
                  layout.setPadding(40, 80, 40, 40)
                  layout.gravity = Gravity.CENTER_HORIZONTAL
                  val title = TextView(this)
                  title.text = "Dark Glass Water"
                  title.textSize = 28f
                  title.setTextColor(Color.WHITE)
                  title.gravity = Gravity.CENTER
                  val sub = TextView(this)
                  sub.text = "OceanTheme2 - Tour UI"
                  sub.textSize = 14f
                  sub.setTextColor(Color.parseColor("#7DD3FC"))
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, 10, 0, 40, 0)
                  val card = TextView(this)
                  card.text = "Glass Card\n\nOcean - Glass - Water"
                  card.textSize = 20f
                  card.setTextColor(Color.WHITE)
                  card.setBackgroundColor(Color.parseColor("#1E4A6B"))
                  card.setPadding(50, 50, 50, 50)
                  card.gravity = Gravity.CENTER
                  layout.addView(title)
                  layout.addView(sub)
                  layout.addView(card)
                  val btn = Button(this)
                  btn.text = "Explore Tour"
                  btn.setBackgroundColor(Color.parseColor("#0EA5E9"))
                  btn.setTextColor(Color.WHITE)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Dark Glass Water" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OceanTheme2-APK
          path: app/build/outputs/apk/debug/*.apk
