name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3

      - name: Fix Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/oceantheme2
          mkdir -p app/src/main
          mv MainActivity.kt app/src/main/java/com/example/oceantheme2/ || true
          mv AndroidManifest.xml app/src/main/ || true
          mv build.gradle.kts app/build.gradle.kts || true
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") apply false
            id("org.jetbrains.kotlin.android") apply false
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OceanTheme2-APK
          path: app/build/outputs/apk/debug/*.apk
